<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Readiness Check</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: Eminence Ways' own world, black with crown gold. One column of dark sheets; the result is a boarding pass with a gold stamp. Single theme by choice. */
:root{
  --bg:#0C0C0D; --surface:#17171A; --raised:#212125; --ink:#F5F2EA; --muted:#A9A398; --line:#36332C;
  --gold:#D9A315; --gold-hi:#F2C14E; --gold-soft:#2C2410; --on-gold:#15120A;
  --ok:#63CC92; --ok-soft:#12301F; --prog:#7FB7F5; --prog-soft:#14273D; --gap:#F27F74; --gap-soft:#3A1715;
  --font-display:"Cinzel","Trajan Pro","Times New Roman",serif;
  --font-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.08;font-weight:600}
p{margin:0}
:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.lab{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.top{border-bottom:1px solid var(--line);background:#000}
.top .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px}
.top img{height:54px;width:auto;display:block}
.event{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

.steps{display:flex;gap:6px;list-style:none;margin:0;padding:16px 0 0}
.steps li{flex:1;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:3px solid var(--line);padding-top:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li b{margin-right:8px}
.steps li.on{color:var(--gold);border-color:var(--gold)}
.steps li.past{border-color:var(--gold);color:var(--ink)}
@media (max-width:560px){.steps li span{display:none}}

main{padding:30px 0 110px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.lede{font-size:18px;color:var(--muted);max-width:34em}

.intro{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:start}
@media (max-width:860px){.intro{grid-template-columns:1fr;gap:26px}}
.pitch{display:flex;flex-direction:column;gap:20px;padding-top:10px}
.pitch h1{font-size:clamp(44px,6.6vw,78px);font-weight:700;line-height:1.02}
.pitch h1 em{font-style:normal;color:var(--gold)}
.how{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.how li{display:flex;gap:18px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);font-weight:500}
.how b{font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--gold)}

.sheet{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);padding:26px;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:26px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input{width:100%;min-width:0;height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:4px;background:var(--bg);font-size:18px}
.field input::placeholder{color:#6F6A61}
.field input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.field.bad input{border-color:var(--gap)}
.err{color:var(--gap);font-size:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--muted)}
.consent input{width:24px;height:24px;margin:0;flex:none;accent-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border-radius:4px;border:2px solid var(--gold);background:var(--gold);color:var(--on-gold);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold);background:transparent}
.btn.small{min-height:46px;font-size:13px;padding:0 18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.end{justify-content:space-between}

.head{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.head h1{font-size:clamp(32px,4.6vw,50px);font-weight:700}
.block{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.block h2{font-size:21px}
.block h2 small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--muted);margin-left:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:0 16px;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;font-weight:500;text-align:left}
.chip:hover{border-color:var(--gold)}
.chip i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 6px;border:1px solid currentColor;border-radius:2px;color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.chip[aria-pressed="true"] i{color:var(--on-gold)}

.group{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);margin-bottom:18px}
.group>h2{font-size:21px;padding:18px 20px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.group>h2 small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--muted)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.item p{font-weight:500}
.item small{display:block;color:var(--muted);font-size:14px;font-weight:400;margin-top:2px}
.seg{display:inline-grid;grid-template-columns:repeat(3,auto);border:1.5px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{min-height:46px;padding:0 14px;background:transparent;border:0;border-left:1.5px solid var(--line);cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[data-v="0"][aria-pressed="true"]{background:var(--raised);color:var(--ink)}
.seg button[data-v="1"][aria-pressed="true"]{background:var(--prog-soft);color:var(--prog)}
.seg button[data-v="2"][aria-pressed="true"]{background:var(--ok-soft);color:var(--ok)}
@media (max-width:640px){.item{grid-template-columns:1fr}.seg{display:grid;grid-template-columns:repeat(3,1fr)}}
.dock{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--gold);padding:12px 0;margin-top:8px}
.dock .row{justify-content:space-between}
.tally{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{color:var(--ink)}

.pass{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 250px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);margin-bottom:16px}
.pass-main{padding:22px 24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.pass-main img{height:36px;width:auto;align-self:flex-start}
.pass-stub{position:relative;padding:22px 24px;border-left:2px dashed var(--line);display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.pass-stub::before,.pass-stub::after{content:"";position:absolute;left:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pass-stub::before{top:-13px}.pass-stub::after{bottom:-13px}
.route{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.route .port{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,5.4vw,54px);line-height:1}
.route .port small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);margin-top:6px}
.route .line{flex:1;min-width:40px;height:0;border-top:2px dashed var(--gold);position:relative}
.route .line::after{content:"";position:absolute;right:-2px;top:-7px;border-left:10px solid var(--gold);border-top:6px solid transparent;border-bottom:6px solid transparent}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px}
.facts div p:last-child{font-weight:600;overflow-wrap:anywhere}
.score{font-family:var(--font-display);font-weight:700;font-size:84px;line-height:.9;font-variant-numeric:tabular-nums;color:var(--gold)}
.score small{font-size:24px;color:var(--muted);font-weight:500}
.inkstamp{align-self:flex-start;white-space:nowrap;font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-hi);border:3px double var(--gold-hi);padding:6px 12px;border-radius:4px;transform:rotate(-6deg);transform-origin:left center;animation:thunk .5s cubic-bezier(.2,1.6,.4,1) .15s both}
@keyframes thunk{from{transform:rotate(-15deg) scale(1.9);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.inkstamp{animation:none}}
@media (max-width:760px){.pass{grid-template-columns:1fr}.pass-stub{border-left:0;border-top:2px dashed var(--line);flex-direction:row;align-items:center;flex-wrap:wrap}.pass-stub::before,.pass-stub::after{display:none}}

.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px}
.count{background:var(--surface);border:1px solid var(--line);padding:12px 16px;border-left:4px solid var(--line);display:flex;align-items:baseline;gap:12px}
.count.c-gap{border-left-color:var(--gap)}.count.c-prog{border-left-color:var(--prog)}.count.c-ok{border-left-color:var(--ok)}
.count b{font-family:var(--font-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:14px;color:var(--muted)}
@media (max-width:620px){.counts{grid-template-columns:1fr}}

.sec{margin:30px 0 14px;display:flex;flex-direction:column;gap:6px}
.sec h2{font-size:28px;font-weight:700}
.sec p{color:var(--muted);max-width:44em}
.pri{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);padding:16px 18px;margin-bottom:10px;display:flex;flex-direction:column;gap:12px}
.pri.s-gap{border-left-color:var(--gap)}.pri.s-progress,.pri.s-ready,.pri.s-check{border-left-color:var(--prog)}
.pri-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.pri-head .n{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--gold);min-width:1.2em}
.pri-head h3{font-family:var(--font-body);font-size:19px;font-weight:600;flex:1 1 240px;line-height:1.25}
.tag{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:2px;white-space:nowrap}
.tag.s-gap{background:var(--gap-soft);color:var(--gap)}
.tag.s-progress,.tag.s-ready,.tag.s-check{background:var(--prog-soft);color:var(--prog)}
.tag.s-done{background:var(--ok-soft);color:var(--ok)}
.mk{font-size:10px;font-weight:700;letter-spacing:.1em;border:1px solid var(--muted);color:var(--muted);border-radius:2px;padding:3px 6px;white-space:nowrap}
.br{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.br{grid-template-columns:1fr}}
.br div{background:var(--raised);padding:10px 12px;border-radius:4px;font-size:15px}
.br b{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.br .good b{color:var(--ok)}.br .bad b{color:var(--gap)}
.svc{font-size:14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;color:var(--muted)}
.svc b{color:var(--gold);font-weight:600}
details.more{background:var(--surface);border:1px solid var(--line);margin-top:4px}
details.more summary{cursor:pointer;padding:14px 18px;font-weight:600;color:var(--gold);min-height:50px}
details.more ul,.cleared{list-style:none;margin:0;padding:0}
details.more li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);font-size:15px;font-weight:500}
details.more li span:last-child{margin-left:auto;color:var(--muted);font-size:13px;font-weight:400}
.cleared{display:flex;flex-wrap:wrap;gap:8px}
.cleared li{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;background:var(--ok-soft);color:var(--ok);border-radius:4px;font-size:14px;font-weight:500}
.cleared li::before{content:"";width:9px;height:5px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg) translateY(-2px)}
.helps{display:flex;flex-wrap:wrap;gap:8px}
.helps span{padding:8px 12px;border:1px solid var(--gold);color:var(--gold);border-radius:4px;font-size:14px;font-weight:600}
.wa{margin-top:30px;background:var(--surface);border:1px solid var(--gold);padding:22px 24px;display:flex;flex-wrap:wrap;gap:16px 30px;align-items:center;justify-content:space-between}
.wa h2{font-size:26px;font-weight:700}
.wa p{color:var(--muted);max-width:36em;overflow-wrap:anywhere}
.wa p b{color:var(--ink)}
.fine{font-size:13px;color:var(--muted);margin-top:18px;max-width:60em}

footer{border-top:1px solid var(--line);padding:14px 0 28px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.link{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:8px}
.dot.up{background:var(--ok)}.dot.wait{background:var(--gold)}

.veil{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;padding:24px 0 60px}
.veil[hidden]{display:none}
.pin{max-width:380px;margin:8vh auto 0}
.send{max-width:640px;margin:4vh auto 0}
pre.msg{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--font-body);font-size:14px;background:var(--bg);border:1px solid var(--line);padding:14px;margin:0;max-height:44vh;overflow:auto}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.wrapcell{white-space:normal;min-width:220px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{font-variant-numeric:tabular-nums}
td a{color:var(--gold);font-weight:600}
.note{font-size:14px;color:var(--muted)}
.note.warn{color:var(--gold-hi)}
textarea{width:100%;min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:10px}
</style>
</head>

const STATUS = {gap:"Required", progress:"In progress", ready:"Ready to certify", check:"To confirm", done:"Cleared"};
const ORDER = {gap:0, progress:1, ready:2, check:3, done:4};

/* ---------- state ---------- */
function blank(){
  return {step:0, lead:{name:"",company:"",position:"",phone:"",email:"",consent:false},
    sector:"", flags:{personal:false,cards:false,product:false,finClients:false}, markets:[], answers:{},
    leadId:null, createdAt:null};
}
let S = blank();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const marketOf = id => MARKETS.find(m => m.id === id);
const sectorName = id => (SECTORS.find(s => s.id === id) || {name:""}).name;
const visibleItems = g => g.items.filter(i => !i.cond || S.flags[i.cond]);
const val = (v, p) => typeof v === "function" ? v(p) : v;

/* ---------- scoring and roadmap ---------- */
function scoreOf(items){
  let got = 0, max = 0;
  items.forEach(i => { max += i.w; got += i.w * ((S.answers[i.id] || 0) / 2); });
  return max ? Math.round(100 * got / max) : 0;
}
function allItems(){ return GROUPS.flatMap(visibleItems); }
function band(score){ return score >= 90 ? "Ready to bid" : score >= 70 ? "Nearly ready" : score >= 40 ? "Building" : "Early stage"; }
function reqStatus(r){
  if (r.check) return "check";
  const v = r.items.map(i => S.answers[i] || 0);
  if (v.every(x => x === 2)) return r.cap ? "ready" : "done";
  if (v.every(x => x === 0)) return "gap";
  return "progress";
}
function roadmap(){
  const out = [];
  REQS.forEach(r => {
    if (r.cond && !r.cond(S)) return;
    const codes = S.markets.filter(m => !r.mk || r.mk.includes(m)).map(m => marketOf(m).code);
    if (!codes.length) return;
    out.push({id:r.id, t:val(r.t, S), b:r.b, r:val(r.r, S), svc:SERVICES[r.svc], pr:r.pr, status:reqStatus(r), codes});
  });
  out.sort((a,b) => a.pr - b.pr || ORDER[a.status] - ORDER[b.status]);
  return out;
}
function servicesFor(rows){
  const seen = [];
  rows.filter(x => x.status !== "done").forEach(x => { if (!seen.includes(x.svc)) seen.push(x.svc); });
  return seen;
}

/* ---------- WhatsApp report ---------- */
function waNumber(phone){
  const p = String(phone || "").trim(); let d = p.replace(/\D/g, "");
  if (p.startsWith("+")) return d;
  if (d.startsWith("00")) return d.slice(2);
  if (d.length === 10 && d[0] === "9") return "977" + d;
  return d;
}
function reportText(d){
  const first = String(d.name || "").split(/\s+/)[0] || "there";
  const top = (d.top || []).slice(0, 3), more = (d.openCount || 0) - top.length;
  const lines = [
    "*" + CONFIG.company + " | Market Readiness Report*",
    "Hello " + first + ", here is the summary for *" + d.company + "* from NAS-IT Expo 2026.",
    "",
    "Target markets: " + (d.markets || []).join(", "),
    "Security readiness: *" + d.score + "/100* (" + d.band + ")",
    ""
  ];
  if (top.length){
    lines.push("*Top priorities*");
    top.forEach((x, i) => { lines.push((i + 1) + ". *" + x.t + "*"); lines.push("   Benefit: " + x.b); lines.push("   Risk without it: " + x.r); });
    if (more > 0) lines.push("Plus " + more + " more item" + (more === 1 ? "" : "s") + " on your list.");
    lines.push("");
  }
  if ((d.cleared || []).length){ lines.push("*Already cleared*"); d.cleared.forEach(c => lines.push("- " + c)); lines.push(""); }
  if ((d.services || []).length){ lines.push("*How we can help*"); lines.push(d.services.join(", ")); lines.push(""); }
  lines.push("Reply to this message to plan your first step with our team.");
  lines.push(CONFIG.company + ", " + CONFIG.tagline);
  lines.push(CONFIG.phone + " | " + CONFIG.email);
  return lines.join("\n");
}
const waLink = d => "https://wa.me/" + waNumber(d.phone) + "?text=" + encodeURIComponent(reportText(d));

/* ---------- lead storage: device queue first, then the artifact's db ---------- */
const QK = "ew-expo-lead-queue";
let queue = {};
try { queue = JSON.parse(localStorage.getItem(QK) || "{}") || {}; } catch(e){ queue = {}; }
const persistQueue = () => { try { localStorage.setItem(QK, JSON.stringify(queue)); } catch(e){} };
let db = null, dl = null, capsReady = false, chain = Promise.resolve();
const wait = ms => new Promise(r => setTimeout(r, ms));
function leadDoc(done){
  const d = {id:S.leadId, createdAt:S.createdAt, updatedAt:new Date().toISOString(), status:done ? "completed" : "started",
    name:S.lead.name.trim(), company:S.lead.company.trim(), position:S.lead.position.trim(),
    phone:S.lead.phone.trim(), email:S.lead.email.trim(), consent:!!S.lead.consent,
    sector:sectorName(S.sector), markets:S.markets.map(m => marketOf(m).code),
    profile:FLAGS.filter(f => S.flags[f.id]).map(f => f.id), source:"NAS-IT Expo 2026"};
  if (done){
    const rows = roadmap(), open = rows.filter(x => x.status !== "done"), score = scoreOf(allItems());
    d.score = score; d.band = band(score); d.answers = Object.assign({}, S.answers);
    d.open = open.map(x => x.t + " [" + STATUS[x.status] + "]"); d.openCount = open.length;
    d.top = open.slice(0, CONFIG.topPriorities).map(x => ({t:x.t, b:x.b, r:x.r, status:STATUS[x.status]}));
    d.cleared = rows.filter(x => x.status === "done").map(x => x.t);
    d.services = servicesFor(rows);
  }
  return d;
}
function saveLead(done){
  if (!S.leadId){ S.leadId = "L" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); S.createdAt = new Date().toISOString(); }
  const doc = leadDoc(done);
  queue[doc.id] = doc; persistQueue(); paintDot();
  chain = chain.then(() => upload(doc.id)).catch(() => {});
}
async function upload(id){
  const doc = queue[id];
  if (!doc || !db) return;
  const put = () => db.doc("leads/" + id).set(doc);
  try { await put(); }
  catch(e){
    if (!e || e.code !== "unavailable") { paintDot(); return; }
    await wait(1200 + Math.random() * 1200);
    try { await put(); } catch(e2){ paintDot(); return; }
  }
  if (queue[id] === doc){ delete queue[id]; persistQueue(); }
  paintDot();
}
function flushQueue(){ Object.keys(queue).forEach(id => { chain = chain.then(() => upload(id)).catch(() => {}); }); }
function paintDot(){
  const n = Object.keys(queue).length, dot = $("dot");
  dot.className = "dot" + (n ? " wait" : (db ? " up" : ""));
  dot.title = n ? n + " lead(s) held on this device" : (db ? "Leads are saving" : "");
}
(async () => {
  try {
    if (window.claude && typeof window.claude.use === "function"){
      const got = await Promise.all([window.claude.use("db"), window.claude.use("downloads")]);
      db = got[0]; dl = got[1];
    }
  } catch(e){}
  capsReady = true; paintDot(); flushQueue();
})();

}
function viewRoadmap(){
  const rows = roadmap(), open = rows.filter(x => x.status !== "done"), done = rows.filter(x => x.status === "done");
  const score = scoreOf(allItems()), svcs = servicesFor(rows);
  const gaps = open.filter(x => x.status === "gap").length, prog = open.length - gaps;
  const codes = S.markets.map(m => marketOf(m).code), names = S.markets.map(m => marketOf(m).name);
  const top = open.slice(0, CONFIG.topPriorities), rest = open.slice(CONFIG.topPriorities);
  return `<section class="pass" aria-label="Market entry clearance">
      <div class="pass-main">
        <img src="${LOGO}" alt="" width="149" height="36">
        <div class="route"><div class="port">KTM<small>Nepal</small></div><div class="line" aria-hidden="true"></div><div class="port">${codes.join(" · ")}<small>${esc(names.join(", "))}</small></div></div>
        <div class="facts">
          <div><p class="lab">Company</p><p>${esc(S.lead.company)}</p></div>
          <div><p class="lab">Sector</p><p>${esc(sectorName(S.sector))}</p></div>
          <div><p class="lab">Checked by</p><p>${esc(S.lead.name)}, ${esc(S.lead.position)}</p></div>
        </div>
      </div>
      <div class="pass-stub">
        <div><p class="lab">Security readiness</p><p class="score">${score}<small>/100</small></p></div>
        <span class="inkstamp">${band(score)}</span>
      </div>
    </section>
    <div class="counts">
      <div class="count c-gap"><b>${gaps}</b><span>required, not started</span></div>
      <div class="count c-prog"><b>${prog}</b><span>in progress</span></div>
      <div class="count c-ok"><b>${done.length}</b><span>already cleared</span></div>
    </div>

    ${open.length ? `<div class="sec"><h2>Your top ${top.length === 1 ? "priority" : top.length + " priorities"} for ${esc(codes.join(" and "))}</h2><p>What each one wins you, and what going without it can cost.</p></div>
      ${top.map(priCard).join("")}
      ${rest.length ? `<details class="more"><summary>${rest.length} more item${rest.length === 1 ? "" : "s"} on your list</summary><ul>${rest.map(x => `<li><span class="tag s-${x.status}">${STATUS[x.status]}</span><span>${esc(x.t)}</span><span>${esc(x.svc)}</span></li>`).join("")}</ul></details>` : ""}`
      : `<div class="sec"><h2>Cleared for ${esc(codes.join(" and "))}</h2><p>Every item for these markets is in place. Keep the evidence current and you are ready to bid.</p></div>`}
    ${done.length ? `<div class="sec"><h2>Already cleared</h2></div><ul class="cleared">${done.map(x => `<li>${esc(x.t)}</li>`).join("")}</ul>` : ""}
    ${svcs.length ? `<div class="sec"><h2>How ${esc(CONFIG.company)} can help</h2></div><div class="helps">${svcs.map(s => `<span>${esc(s)}</span>`).join("")}</div>` : ""}
    <section class="wa"><div><h2>Get this report on WhatsApp</h2><p>Ask our team at the booth and we will send it to <b>${esc(S.lead.phone)}</b> now. You can also reach us at ${esc(CONFIG.phone)} or ${esc(CONFIG.email)}.</p></div>
      <div class="row"><button class="btn" type="button" data-act="wa-staff">Staff: send on WhatsApp</button><button class="btn ghost" type="button" data-act="restart">Start a new check</button></div></section>
    <p class="fine">This report is planning guidance based on your answers. It is not legal advice or a certification. What applies to you depends on your products, clients and contracts, and each scheme is certified by its own accredited body.</p>
    <div class="row" style="margin-top:14px"><button class="btn ghost small" type="button" data-act="back">Back to checklist</button></div>`;
}
function render(){
  $("app").innerHTML = [viewDetails, viewBusiness, viewChecklist, viewRoadmap][S.step]();
  paintSteps(); window.scrollTo(0, 0);
}

/* ---------- actions ---------- */
function setErr(id, msg){ const e = $("e-" + id), w = $("w-" + id); if (e) e.textContent = msg || ""; if (w) w.classList.toggle("bad", !!msg); return !msg; }
function submitLead(){
  const g = id => $(id).value.trim();
  S.lead = {name:g("lead-name"), company:g("lead-company"), position:g("lead-position"), phone:g("lead-phone"), email:g("lead-email"), consent:$("lead-consent").checked};
  const L = S.lead; let first = null;
  const check = (id, ok, msg) => { if (!setErr(id, ok ? "" : msg) && !first) first = id; };
  check("lead-name", L.name.length > 1, "Enter your name.");
  check("lead-company", L.company.length > 1, "Enter your company name.");
  check("lead-position", L.position.length > 1, "Enter your position.");
  check("lead-phone", (L.phone.match(/\d/g) || []).length >= 7 && /^[+\d][\d\s()-]*$/.test(L.phone), "Enter a phone number with at least 7 digits.");
  check("lead-email", /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(L.email), "Enter an email address like name@company.com.");
  check("lead-consent", L.consent, "Tick the box so we can send you the report.");
  if (first){ const el = $(first); if (el) el.focus(); return; }
  saveLead(false); S.step = 1; render();
}
document.addEventListener("submit", e => { if (e.target.id === "f-lead"){ e.preventDefault(); submitLead(); } if (e.target.id === "f-pin"){ e.preventDefault(); checkPin(); } });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "chip"){
    const {group, id} = b.dataset;
    if (group === "sector"){ S.sector = id; [...b.parentElement.children].forEach(c => c.setAttribute("aria-pressed", c === b ? "true" : "false")); setErr("sector", ""); }
    if (group === "flag"){ S.flags[id] = !S.flags[id]; b.setAttribute("aria-pressed", String(S.flags[id])); }
    if (group === "market"){ const i = S.markets.indexOf(id); if (i < 0) S.markets.push(id); else S.markets.splice(i, 1); S.markets.sort((a,c) => MARKETS.findIndex(m => m.id === a) - MARKETS.findIndex(m => m.id === c)); b.setAttribute("aria-pressed", String(i < 0)); setErr("market", ""); }
  }
  else if (act === "to-checklist"){
    const a = setErr("sector", S.sector ? "" : "Choose your sector."), c = setErr("market", S.markets.length ? "" : "Choose at least one market.");
    if (a && c){ saveLead(false); S.step = 2; render(); }
  }
  else if (act === "ans"){
    S.answers[b.dataset.item] = Number(b.dataset.v);
    [...b.parentElement.children].forEach(c => c.setAttribute("aria-pressed", c === b ? "true" : "false"));
    $("tally").innerHTML = tallyText();
  }
  else if (act === "to-roadmap"){ S.step = 3; saveLead(true); render(); }
  else if (act === "back"){ S.step = Math.max(0, S.step - 1); render(); }
  else if (act === "restart"){ S = blank(); render(); }
  else if (act === "staff"){ openStaff("leads"); }
  else if (act === "wa-staff"){ openStaff("send"); }
  else if (act === "staff-close"){ closeStaff(); }
  else if (act === "staff-refresh"){ showLeads(); }
  else if (act === "csv-save"){ saveCsv(); }
  else if (act === "csv-copy"){ copyText(buildCsv(), "csv-msg", "Copied. Paste into a spreadsheet."); }
  else if (act === "msg-copy"){ copyText(reportText(leadDoc(true)), "send-msg", "Message copied."); }
});

/* idle reset so one visitor's details never wait on screen for the next */
let idleTimer = null;
function armIdle(){ clearTimeout(idleTimer); idleTimer = setTimeout(() => { if ($("staff").hidden && (S.step > 0 || S.leadId)){ S = blank(); render(); } armIdle(); }, CONFIG.idleResetMinutes * 60000); }
["pointerdown","keydown","scroll"].forEach(ev => document.addEventListener(ev, armIdle, {passive:true}));

/* ---------- staff panel (asks for the PIN every time it opens) ---------- */
let staffRows = [], staffMode = "leads";
function openStaff(mode){
  staffMode = mode; $("staff").hidden = false;
  $("staff-body").innerHTML = `<form class="sheet pin" id="f-pin" novalidate><h2>Staff access</h2><div class="field" id="w-pin"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"><span class="err" id="e-pin" role="alert"></span></div><div class="row"><button class="btn small" type="submit">${mode === "send" ? "Continue" : "Open lead list"}</button><button class="btn ghost small" type="button" data-act="staff-close">Close</button></div></form>`;
  $("pin").focus();
}
function closeStaff(){ $("staff").hidden = true; $("staff-body").innerHTML = ""; }
function checkPin(){ if ($("pin").value !== CONFIG.staffPin){ setErr("pin", "That PIN is not right."); return; } if (staffMode === "send") showSend(); else showLeads(); }
function showSend(){
  const d = leadDoc(true), num = waNumber(d.phone);
  $("staff-body").innerHTML = `<div class="sheet send"><p class="eyebrow">Staff only</p><h2>Send the report to ${esc(d.name)}</h2>
    <p class="note">Opens WhatsApp on this device with a chat to <b>+${esc(num)}</b> and the message below filled in. Check the number, then press send in WhatsApp.${String(d.phone).trim().startsWith("+") ? "" : " The visitor gave no country code, so Nepal (+977) was assumed for a 10-digit mobile."}</p>
    <pre class="msg">${esc(reportText(d))}</pre>
    <div class="row"><a class="btn" href="${esc(waLink(d))}" target="_blank" rel="noopener">Open WhatsApp</a><button class="btn ghost small" type="button" data-act="msg-copy">Copy message</button><button class="btn ghost small" type="button" data-act="staff-close">Back to kiosk</button></div>
    <p class="note" id="send-msg" role="status"></p><div id="send-msg-box"></div></div>`;
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code:"timeout"}), ms))]);
async function showLeads(){
  const body = $("staff-body");
  body.innerHTML = `<div class="head"><h1>Leads</h1><p class="note">Loading.</p></div>`;
  let rows = [], note = "";
  if (db){
    try { const snap = await withTimeout(db.collection("leads").orderBy("createdAt","desc").limit(1000).get(), 10000); rows = snap.docs.map(d => d.data()).filter(Boolean); }
    catch(e){ note = "The lead store could not be reached just now. Leads held on this device are listed below; refresh once the connection is back."; }
  } else if (capsReady){ note = "The shared lead store is not available in this view, so leads are being held on this device only. Export them before clearing the browser."; }
  const seen = new Set(rows.map(r => r.id));
  Object.values(queue).forEach(q => { if (!seen.has(q.id)) rows.push(Object.assign({_local:true}, q)); else { const i = rows.findIndex(r => r.id === q.id); rows[i] = Object.assign({_local:true}, q); } });
  rows.sort((a,b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  staffRows = rows;
  const held = rows.filter(r => r._local).length, complete = rows.filter(r => r.status === "completed").length;
  const time = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}); };
  body.innerHTML = `<div class="head"><p class="eyebrow">Staff only</p><h1>${rows.length} ${rows.length === 1 ? "lead" : "leads"}</h1>
      <p class="note">${complete} finished the checklist, ${rows.length - complete} left after entering details.${held ? ` ${held} held on this device, waiting to upload.` : ""}</p>
      ${note ? `<p class="note warn">${esc(note)}</p>` : ""}
      <div class="row">${dl ? `<button class="btn small" type="button" data-act="csv-save">Download CSV</button>` : ""}<button class="btn ghost small" type="button" data-act="csv-copy">Copy as CSV</button><button class="btn ghost small" type="button" data-act="staff-refresh">Refresh</button><button class="btn ghost small" type="button" data-act="staff-close">Back to kiosk</button></div>
      <p class="note" id="csv-msg" role="status"></p><div id="csv-msg-box"></div></div>
    ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>Time</th><th>Name</th><th>Company</th><th>Position</th><th>WhatsApp</th><th>Report</th><th>Email</th><th>Sector</th><th>Markets</th><th>Score</th><th>Services to pitch</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(time(r.createdAt))}${r._local ? " *" : ""}</td><td>${esc(r.name)}</td><td>${esc(r.company)}</td><td>${esc(r.position)}</td><td>${esc(r.phone)}</td><td>${r.status === "completed" ? `<a href="${esc(waLink(r))}" target="_blank" rel="noopener">Send</a>` : "-"}</td><td>${esc(r.email)}</td><td>${esc(r.sector)}</td><td>${esc((r.markets || []).join(" "))}</td><td class="num">${r.status === "completed" ? esc(r.score) : "-"}</td><td class="wrapcell">${esc((r.services || []).join(", "))}</td></tr>`).join("")}
      </tbody></table></div>${held ? `<p class="note" style="margin-top:8px">* held on this device, not yet uploaded</p>` : ""}` : `<p class="note">No leads yet. The first one appears here as soon as a visitor enters their details.</p>`}`;
}
function csvCell(v){
  if (Array.isArray(v)) v = v.map(x => x && typeof x === "object" ? x.t : x).join("; ");
  let s = String(v == null ? "" : v);
  if (/^[=@]/.test(s) || /^[+-](?![\d\s()-]*$)/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function buildCsv(){
  const cols = ["createdAt","status","name","company","position","phone","email","sector","markets","profile","score","band","services","top","open","cleared","consent","source"];
  return [cols.join(",")].concat(staffRows.map(r => cols.map(c => csvCell(r[c])).join(","))).join("\r\n");
}
async function saveCsv(){
  const msg = $("csv-msg");
  try { await dl.save({filename:"eminence-ways-expo-leads-" + new Date().toISOString().slice(0,10) + ".csv", data:buildCsv()}); msg.textContent = "CSV saved."; }
  catch(e){ msg.textContent = e && e.code === "declined" ? "Download cancelled." : "The download did not go through here. Use Copy as CSV instead."; }
}
async function copyText(text, msgId, okMsg){
  const msg = $(msgId);
  try { await navigator.clipboard.writeText(text); msg.textContent = okMsg; }
  catch(e){ $(msgId + "-box").innerHTML = `<textarea id="${msgId}-text" readonly aria-label="Text to copy"></textarea>`; const t = $(msgId + "-text"); t.value = text; t.focus(); t.select(); msg.textContent = "Copy was blocked here. The text is selected below; copy it by hand."; }
}

/* ---------- boot, keeping a visitor's place across a republish ---------- */
function start(data){ if (data && typeof data.step === "number") S = Object.assign(blank(), data); render(); armIdle(); paintDot(); }
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => JSON.parse(JSON.stringify(S))); } catch(e){}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
</script>
</body>
